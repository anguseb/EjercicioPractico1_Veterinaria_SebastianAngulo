<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <!-- Fragmento 1: botón y ventana modal para agregar un servicio -->
        <section th:fragment="agregar">
            <div class="mb-3">
                <button type="button" class="btn btn-vet" data-bs-toggle="modal" data-bs-target="#modalAgregar">
                    <span th:text="#{servicio.agregar}">Agregar</span></button>
            </div>

            <div class="modal fade" id="modalAgregar" tabindex="-1" aria-labelledby="tituloAgregar" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header vet-modal">
                            <h5 class="modal-title" id="tituloAgregar">
                                <span th:text="#{servicio.agregar}">Agregar</span></h5>
                            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                    th:aria-label="#{accion.cerrar}"></button>
                        </div>
                        <form th:action="@{/servicios/registrar}" th:object="${servicio}" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label" th:text="#{servicio.nombre}">Nombre</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" maxlength="100" required="required"/>
                                </div>
                                <div class="mb-3">
                                    <label for="idTipoServicio" class="form-label" th:text="#{servicio.tipo}">Tipo</label>
                                    <select class="form-select" id="idTipoServicio" name="idTipoServicio" required="required">
                                        <option value="" th:text="#{servicio.seleccione}">Seleccione un tipo</option>
                                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}">Tipo</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="precio" class="form-label" th:text="#{servicio.precio}">Precio</label>
                                        <input type="number" class="form-control" th:field="*{precio}" min="0.01" step="0.01" required="required"/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="duracionMinutos" class="form-label" th:text="#{servicio.duracion}">Duración</label>
                                        <input type="number" class="form-control" th:field="*{duracionMinutos}" min="1" step="1" required="required"/>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <span th:text="#{accion.cancelar}">Cancelar</span></button>
                                <button type="submit" class="btn btn-vet">
                                    <span th:text="#{accion.guardar}">Guardar</span></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Fragmento 2: tabla con nombre, tipo, precio y duración -->
        <section th:fragment="tabla">
            <div class="card card-vet">
                <div class="card-header"><h4 th:text="#{servicio.listado}">Listado</h4></div>
                <div class="card-body">
                    <div class="table-responsive" th:if="${servicios != null and !servicios.isEmpty()}">
                        <table class="table table-striped table-hover align-middle tabla-vet">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th th:text="#{servicio.nombre}">Nombre</th>
                                    <th th:text="#{servicio.tipo}">Tipo</th>
                                    <th th:text="#{servicio.precio}">Precio</th>
                                    <th th:text="#{servicio.duracion}">Duración</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${servicios}">
                                    <td th:text="${s.id}">1</td>
                                    <td th:text="${s.nombre}">Nombre</td>
                                    <td><span class="badge badge-vet" th:text="${s.tipoServicio.nombre}">Tipo</span></td>
                                    <td th:text="'₡' + ${#numbers.formatDecimal(s.precio, 1, 'COMMA', 2, 'POINT')}">₡0.00</td>
                                    <td th:text="${s.duracionMinutos} + ' ' + #{servicio.minutos}">30 min</td>
                                    <td class="text-end text-nowrap">
                                        <a th:href="@{/servicios/editar/{id}(id=${s.id})}" class="btn btn-sm btn-acento"
                                           th:text="#{accion.editar}">Editar</a>
                                        <button type="button" class="btn btn-sm btn-danger"
                                                data-bs-toggle="modal" data-bs-target="#modalBorrar"
                                                th:data-id="${s.id}" th:data-nombre="${s.nombre}"
                                                th:text="#{accion.eliminar}">Eliminar</button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${servicios == null or servicios.isEmpty()}">
                        <span th:text="#{lista.vacia}">No hay registros</span>
                    </div>
                </div>
                <div class="card-footer">
                    <span th:text="#{servicio.total}">Total</span>: <strong th:text="${totalServicios}">0</strong>
                </div>
            </div>
        </section>

        <!-- Fragmento 3: ventana modal para confirmar la eliminación -->
        <section th:fragment="confirmarBorrado">
            <div class="modal fade" id="modalBorrar" tabindex="-1" aria-labelledby="tituloBorrar" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <form th:action="@{/servicios/borrar}" method="post">
                            <input type="hidden" name="id" id="borrarId"/>
                            <div class="modal-header bg-danger text-white">
                                <h5 class="modal-title" id="tituloBorrar">
                                    <span th:text="#{confirmar.titulo}">Confirmar</span></h5>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                                        th:aria-label="#{accion.cerrar}"></button>
                            </div>
                            <div class="modal-body">
                                <p><span th:text="#{confirmar.texto}">¿Desea eliminar</span> <strong id="borrarNombre"></strong>?</p>
                                <p class="text-muted mb-0" th:text="#{confirmar.aviso}">No se puede deshacer</p>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                    <span th:text="#{accion.cancelar}">Cancelar</span></button>
                                <button type="submit" class="btn btn-danger">
                                    <span th:text="#{accion.eliminar}">Eliminar</span></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Fragmento 4: formulario de edición con la lista desplegable de tipos -->
        <section th:fragment="formularioEditar">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form th:action="@{/servicios/registrar}" th:object="${servicio}" method="post">
                        <input type="hidden" th:field="*{id}"/>
                        <div class="row g-3 mb-3">
                            <div class="col-6 d-grid">
                                <a th:href="@{/servicios}" class="btn btn-secondary">
                                    <span th:text="#{accion.regresar}">Regresar</span></a>
                            </div>
                            <div class="col-6 d-grid">
                                <button type="submit" class="btn btn-vet">
                                    <span th:text="#{accion.guardar}">Guardar</span></button>
                            </div>
                        </div>
                        <div class="card card-vet">
                            <div class="card-header"><h4 th:text="#{servicio.editar}">Editar</h4></div>
                            <div class="card-body">
                                <div class="mb-3">
                                    <label for="nombre" class="form-label" th:text="#{servicio.nombre}">Nombre</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" maxlength="100" required="required"/>
                                </div>
                                <div class="mb-3">
                                    <label for="idTipoServicio" class="form-label" th:text="#{servicio.tipo}">Tipo</label>
                                    <select class="form-select" id="idTipoServicio" name="idTipoServicio" required="required">
                                        <option th:each="t : ${tipos}" th:value="${t.id}" th:text="${t.nombre}"
                                                th:selected="${t.id == servicio.tipoServicio.id}">Tipo</option>
                                    </select>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="precio" class="form-label" th:text="#{servicio.precio}">Precio</label>
                                        <input type="number" class="form-control" th:field="*{precio}" min="0.01" step="0.01" required="required"/>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="duracionMinutos" class="form-label" th:text="#{servicio.duracion}">Duración</label>
                                        <input type="number" class="form-control" th:field="*{duracionMinutos}" min="1" step="1" required="required"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </body>
</html>
