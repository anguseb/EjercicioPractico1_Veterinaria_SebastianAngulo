<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <body>

        <!-- Fragmento: tabla de solo lectura con las citas -->
        <section th:fragment="tabla">
            <div class="card card-vet">
                <div class="card-header"><h4 th:text="#{cita.listado}">Listado</h4></div>
                <div class="card-body">
                    <div class="table-responsive" th:if="${citas != null and !citas.isEmpty()}">
                        <table class="table table-striped table-hover align-middle tabla-vet">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th th:text="#{cita.mascota}">Mascota</th>
                                    <th th:text="#{cita.propietario}">Propietario</th>
                                    <th th:text="#{cita.fecha}">Fecha</th>
                                    <th th:text="#{cita.servicio}">Servicio</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="c : ${citas}">
                                    <td th:text="${c.id}">1</td>
                                    <td th:text="${c.nombreMascota}">Mascota</td>
                                    <td th:text="${c.nombrePropietario}">Propietario</td>
                                    <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}">01/01/2026</td>
                                    <td><span class="badge badge-vet" th:text="${c.servicio.nombre}">Servicio</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${citas == null or citas.isEmpty()}">
                        <span th:text="#{lista.vacia}">No hay registros</span>
                    </div>
                </div>
                <div class="card-footer">
                    <span th:text="#{cita.total}">Total</span>: <strong th:text="${totalCitas}">0</strong>
                </div>
            </div>
        </section>

    </body>
</html>
